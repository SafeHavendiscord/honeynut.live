# Builds the HoneyNUT Ringtone Maker Android app (android-app/), tests it on a
# virtual phone, and attaches the installable APK to the run.
name: Android app

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Reuse the same signing key on every build, so a new APK installs
      # over the old one instead of Android refusing the update.
      - name: Reuse signing key
        uses: actions/cache@v4
        with:
          path: android-app/ci-debug.keystore
          key: honeynut-ringtone-ci-keystore

      - name: Make a signing key (first build only)
        run: |
          [ -f ci-debug.keystore ] || keytool -genkeypair -keystore ci-debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=HoneyNUT Ringtone Maker"

      - name: Make test videos
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          d=app/src/androidTest/assets; mkdir -p $d
          v="-f lavfi -i testsrc=size=320x240:rate=15"
          ffmpeg -loglevel error $v -f lavfi -i sine=frequency=440:sample_rate=44100 -ac 2 -t 5 -c:v libx264 -pix_fmt yuv420p -c:a aac $d/stereo_44k.mp4
          ffmpeg -loglevel error $v -f lavfi -i sine=frequency=660:sample_rate=48000 -ac 1 -t 4 -c:v libx264 -pix_fmt yuv420p -c:a aac $d/mono_48k.mp4
          ffmpeg -loglevel error $v -f lavfi -i sine=frequency=330:sample_rate=48000 -ac 6 -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac $d/surround_51.mp4
          ffmpeg -loglevel error $v -t 2 -c:v libx264 -pix_fmt yuv420p $d/no_audio.mp4
          ls -l $d

      - name: Build the app
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: HoneyNUT-Ringtone-Maker-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Turn on the virtual phone's speed boost (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on a virtual Android phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: android-app
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n live.honeynut.ringtone/.MainActivity
            sleep 4
            adb exec-out screencap -p > screenshot.png

      - name: Save screenshot and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            android-app/screenshot.png
            android-app/app/build/reports/androidTests/
          if-no-files-found: ignore

      # Lets Claude look at the screenshot from the log (it can't download artifacts).
      - name: Print small screenshot
        if: always()
        run: |
          [ -f screenshot.png ] || exit 0
          python3 -c "import sys" && pip install -q pillow >/dev/null 2>&1 || true
          python3 - <<'PY'
          from PIL import Image; import base64, io
          im = Image.open("screenshot.png").convert("RGB"); im.thumbnail((360, 800))
          b = io.BytesIO(); im.save(b, "JPEG", quality=60)
          s = base64.b64encode(b.getvalue()).decode()
          print("SCREENSHOT-BEGIN")
          for i in range(0, len(s), 4000): print(s[i:i+4000])
          print("SCREENSHOT-END")
          PY
